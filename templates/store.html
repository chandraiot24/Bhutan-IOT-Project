<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhutan Products Store</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-green-400 font-mono p-4">
  <h1 class="text-3xl text-center mb-6">Bhutan Products Store</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for item in products %}
    <div class="border border-green-500 p-4 text-center">
      <img src="{{ item.image }}" alt="{{ item.name }}" class="mx-auto mb-2">
      <h2 class="text-xl mb-2">{{ item.name }}</h2>
      <p class="mb-2">{{ item.description }}</p>
      <p class="font-bold mb-2">$ {{ '%.2f'|format(item.price) }}</p>
    </div>
    {% endfor %}
  </div>

  <div class="text-center mt-6">
    <a href="/" class="underline text-blue-300">Back to Dashboard</a>
  </div>
</body>
</html>
